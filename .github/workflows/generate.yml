name: Generate Monthly Flyer

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: "対象月 (1-12, 空欄なら今月)"
        required: false
        default: ""
      force_run:
        description: "強制再生成 (true で差分チェックをスキップして必ず生成)"
        required: false
        default: "false"
  repository_dispatch:
    types: [external-poll]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: generate-flyer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rlight-flyer-bot
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rlight-flyer-bot/requirements.txt

      - name: Cache apt packages (Japanese fonts)
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-cache
          key: apt-fonts-noto-cjk-v1

      - name: Install Japanese fonts
        run: |
          if [ -d "$HOME/apt-cache" ] && [ "$(ls -A $HOME/apt-cache 2>/dev/null)" ]; then
            sudo cp -r $HOME/apt-cache/* /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          mkdir -p $HOME/apt-cache
          sudo cp /var/cache/apt/archives/*.deb $HOME/apt-cache/ 2>/dev/null || true
          sudo chown -R $USER $HOME/apt-cache
        working-directory: .

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process AI edit requests
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_edit_processor.py

      - name: Generate flyer
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          # workflow_dispatch (force_run=true) と手動以外はポーリングモード扱い:
          # schedule / repository_dispatch / workflow_dispatch (force_run=false) → 差分があった時だけ生成
          POLLING_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_run == 'true') && 'false' || 'true' }}
        run: python generate_flyer.py

      - name: Commit state and config if changed
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain rlight-flyer-bot/.state/ rlight-flyer-bot/config.json)" ]; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add rlight-flyer-bot/.state/ rlight-flyer-bot/config.json
            git commit -m "Update state/config [skip ci]"
            git push
          else
            echo "No state/config changes."
          fi

      - name: Upload generated images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flyer-${{ github.run_id }}
          path: |
            rlight-flyer-bot/output.jpg
            rlight-flyer-bot/output_template.jpg
          if-no-files-found: ignore
