name: Generate Monthly Flyer

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: "対象月 (1-12, 空欄なら今月)"
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: generate-flyer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rlight-flyer-bot
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
        working-directory: .

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process AI edit requests
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_EDIT_CHANNEL_ID: ${{ secrets.DISCORD_EDIT_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_edit_processor.py

      - name: Generate flyer
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          POLLING_MODE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python generate_flyer.py

      - name: Commit state and config if changed
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain rlight-flyer-bot/.state/ rlight-flyer-bot/config.json)" ]; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add rlight-flyer-bot/.state/ rlight-flyer-bot/config.json
            git commit -m "Update state/config [skip ci]"
            git push
          else
            echo "No state/config changes."
          fi

      - name: Upload generated images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flyer-${{ github.run_id }}
          path: |
            rlight-flyer-bot/output.jpg
            rlight-flyer-bot/output_template.jpg
          if-no-files-found: ignore
